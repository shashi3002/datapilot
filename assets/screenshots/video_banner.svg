<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="2"/>
  <rect width="960" height="480" rx="16" fill="url(#dotGrid)"/>

  <!-- Top Bar Mockup -->
  <rect x="30" y="24" width="900" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="54" cy="46" r="6" fill="#ef4444"/>
  <circle cx="74" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="94" cy="46" r="6" fill="#10b981"/>
  <text x="120" y="51" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">DataPilot — Multimodal Dataset Quality Auditor UI</text>

  <!-- Central Glass Card -->
  <rect x="80" y="90" width="800" height="340" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>

  <!-- Badges -->
  <rect x="120" y="125" width="130" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="185" y="142" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Step 1: Setup</text>

  <rect x="260" y="125" width="140" height="26" rx="13" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="330" y="142" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Step 2: Schema</text>

  <rect x="410" y="125" width="150" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="485" y="142" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Step 3: Studio</text>

  <rect x="570" y="125" width="160" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="650" y="142" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Step 4: Findings</text>

  <!-- Big Play Button -->
  <g filter="url(#glow)" cursor="pointer">
    <circle cx="480" cy="245" r="48" fill="url(#btnGradient)"/>
    <polygon points="468,225 504,245 468,265" fill="#ffffff"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="480" y="335" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Watch Full DataPilot UI Walkthrough Demo</text>
  <text x="480" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Click to play video — Hugging Face Ingestion • AI Metrics • Live Evaluation • Curated Export</text>

  <!-- Bottom CTA Pill -->
  <rect x="360" y="388" width="240" height="28" rx="14" fill="#334155" fill-opacity="0.8"/>
  <text x="480" y="407" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">▶ Click Here to Watch Video</text>
</svg>
